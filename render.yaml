services:
  - type: web
    name: omni-share
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: PUBLIC_BASE_URL
        value: https://omni-share-5ua4.onrender.com
      - key: SECRET_KEY
        generateValue: true
